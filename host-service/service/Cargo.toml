[package]
name = "purrdr-host-service"
version = "0.17.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
base64 = "0.22.1"
# 主機取檔：開檔後以 handle 取得實際路徑(macOS F_GETPATH、Linux /proc/self/fd、Windows GetFinalPathNameByHandle)。
filepath = "0.2.0"
# 更新：解開 Release 壓縮檔(tar.gz、Windows 的 zip)。
flate2 = "1.1.11"
futures-util.workspace = true
getrandom = "0.4.3"
# 唯讀 git(git.status／git.diff):程序內讀 repo,不執行 git。只開 index、excludes——
# status／dirwalk／blob-diff 會帶入 attributes 與 gix-command(可能執行 filter 程式)。
gix = { version = "0.90.0", default-features = false, features = ["index", "excludes", "sha1"] }
gix-imara-diff = { version = "0.3.3", features = ["unified_diff"] }
humantime = "2.4.0"
qrcode = { version = "0.14.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
subtle = "2.6.1"
tar = "0.4.46"
tokio = { workspace = true, features = ["process"] }
# 安裝時檢查 herdr config.toml:按鍵是否已被占用、加上快捷鍵後是否仍是合法 TOML。
toml = "1.2.1"
# 主機取檔排除清單比對前做 NFKC,擋下 ſ、ﬅ 這類相似字元(raychiutw/purrdr.host#94)。
unicode-normalization = "0.1.26"
# 更新：向 GitHub Release 取版本與下載(rustls、ring)。
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
# 主機取檔開檔的 O_NOFOLLOW、O_NONBLOCK。
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
# 背景啟動程式前把自己的標準 handle 設成不可繼承(raychiutw/purrdr.host#35)。
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
futures-util.workspace = true
# 排程測試以暫停的時鐘推進時間。
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.27.0"
tokio-tungstenite.workspace = true

[features]
# 正式版忽略 `PURRDR_HOST_SERVICE_RELEASE_URL`;debug 建置或開這個 feature 時才換 Release 來源(實機驗證用)。
release-url-override = []

[lints]
workspace = true

# 假的 herdr CLI 是這支測試執行檔本身(帶 fake-herdr 參數),所以不用 libtest。
[[test]]
name = "pane_terminal"
harness = false

# 壓縮檔裡假的主機服務是這支測試執行檔本身，所以不用 libtest。
[[test]]
name = "install_script"
harness = false

# 假的 herdr CLI(plugin list／install／uninstall)是這支測試執行檔本身，所以不用 libtest。
[[test]]
name = "push_plugin"
harness = false

# 假的 herdr CLI(plugin list／install／uninstall)是這支測試執行檔本身，所以不用 libtest。
[[test]]
name = "direct_push"
harness = false

[[test]]
name = "codex_usage"
harness = false

# 自己當「呼叫端」程序，所以不用 libtest。
[[test]]
name = "detached_stdio"
harness = false
